  <rect x="310" y="370" width="340" height="50" rx="4" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.5"/>
  <text x="480" y="393" fill="#0F3E31" font-size="14.5" font-weight="bold" text-anchor="middle">2. Tìm 3 Phương Án Đi Lại Tốt Nhất</text>
  <text x="480" y="411" fill="#555555" font-size="12.5" text-anchor="middle">Nhanh nhất • Ít đổi tuyến nhất • Tiết kiệm nhất</text>

  <line x1="480" y1="420" x2="480" y2="446" stroke="#0F3E31" stroke-width="2"/>
