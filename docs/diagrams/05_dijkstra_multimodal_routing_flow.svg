  <text x="480" y="291" fill="#92400E" font-size="13" text-anchor="middle">(Mưa to / Nắng gắt / Ban đêm)</text>

  <line x1="620" y1="277" x2="715" y2="277" stroke="#B45309" stroke-width="1.5"/>
  <polygon points="715,277 706,272 706,282" fill="#B45309"/>
  <rect x="715" y="248" width="225" height="58" rx="4" fill="#FFFDF5" stroke="#B45309" stroke-width="1.2"/>
  <text x="827" y="272" fill="#92400E" font-size="13.5" font-weight="bold" text-anchor="middle">Ưu Tiên Tuyến Đi Ngầm</text>
  <text x="827" y="292" fill="#92400E" font-size="12.5" text-anchor="middle">Tránh nắng mưa, mát mẻ, an toàn</text>

  <line x1="827" y1="306" x2="827" y2="355" stroke="#B45309" stroke-width="1.5"/>
  <line x1="827" y1="355" x2="480" y2="355" stroke="#B45309" stroke-width="1.5"/>

  <line x1="480" y1="322" x2="480" y2="370" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="480,370 474,362 486,362" fill="#0F3E31"/>

