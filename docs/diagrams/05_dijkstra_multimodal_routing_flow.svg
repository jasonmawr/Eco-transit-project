<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <rect x="20" y="15" width="920" height="42" rx="4" fill="#0F3E31" stroke="#082820" stroke-width="1"/>
  <text x="480" y="42" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">
    HÌNH 5. LƯU ĐỒ THUẬT TOÁN DIJKSTRA &amp; TÍNH GIÁ VÉ GỘP CHUẨN (DIJKSTRA FLOWCHART)
  </text>

  <!-- START -->
  <rect x="380" y="80" width="200" height="40" rx="20" fill="#0F3E31" stroke="#082820" stroke-width="1.5"/>
  <text x="480" y="105" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">BẮT ĐẦU: Nhập Điểm Đi / Đến</text>

  <line x1="480" y1="120" x2="480" y2="145" stroke="#0F3E31" stroke-width="1.5"/>
  <polygon points="480,145 475,138 485,138" fill="#0F3E31"/>

  <!-- STEP 1 -->
  <rect x="340" y="145" width="280" height="50" rx="4" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.2"/>
  <text x="480" y="167" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">Nạp Đồ Thị 14 Ga Metro 1 &amp; Tuyến Bus</text>
  <text x="480" y="185" fill="#555555" font-size="11" text-anchor="middle">Trọng số: Khoảng cách, Thời gian, Phương thức</text>

  <line x1="480" y1="195" x2="480" y2="220" stroke="#0F3E31" stroke-width="1.5"/>
  <polygon points="480,220 475,213 485,213" fill="#0F3E31"/>

  <!-- DECISION WEATHER -->
  <polygon points="480,220 600,260 480,300 360,260" fill="#FEF9E7" stroke="#B45309" stroke-width="1.2"/>
  <text x="480" y="255" fill="#92400E" font-size="11.5" font-weight="bold" text-anchor="middle">Context Thời Tiết?</text>
  <text x="480" y="272" fill="#92400E" font-size="10.5" text-anchor="middle">(Mưa / Nắng nóng / Ban đêm)</text>

  <line x1="600" y1="260" x2="710" y2="260" stroke="#B45309" stroke-width="1.2"/>
  <polygon points="710,260 703,256 703,264" fill="#B45309"/>
  <rect x="710" y="235" width="220" height="50" rx="4" fill="#FFFDF5" stroke="#B45309" stroke-width="1"/>
  <text x="820" y="255" fill="#92400E" font-size="11" font-weight="bold" text-anchor="middle">Tăng trọng số Đi bộ (+50%)</text>
  <text x="820" y="273" fill="#92400E" font-size="10" text-anchor="middle">Ưu tiên đi ngầm Metro 1 mát mẻ</text>

  <line x1="820" y1="285" x2="820" y2="330" stroke="#B45309" stroke-width="1.2"/>
  <line x1="820" y1="330" x2="480" y2="330" stroke="#B45309" stroke-width="1.2"/>

  <line x1="480" y1="300" x2="480" y2="345" stroke="#0F3E31" stroke-width="1.5"/>
  <polygon points="480,345 475,338 485,338" fill="#0F3E31"/>

  <!-- STEP 2 -->
  <rect x="340" y="345" width="280" height="45" rx="4" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.2"/>
  <text x="480" y="365" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">Dijkstra: Tìm 3 Đường Đi Ngắn Nhất</text>
  <text x="480" y="380" fill="#555555" font-size="10.5" text-anchor="middle">Tối ưu thời gian &amp; số lần chuyển tuyến</text>

  <line x1="480" y1="390" x2="480" y2="415" stroke="#0F3E31" stroke-width="1.5"/>
  <polygon points="480,415 475,408 485,408" fill="#0F3E31"/>

  <!-- STEP 3 -->
  <rect x="270" y="415" width="420" height="65" rx="4" fill="#0F3E31" stroke="#082820" stroke-width="1.5"/>
  <text x="480" y="437" fill="#A7F3D0" font-size="12.5" font-weight="bold" text-anchor="middle">consolidateLegs() &amp; calculateMetroFare()</text>
  <text x="480" y="455" fill="#ffffff" font-size="11" text-anchor="middle">Gộp chặng liên tục ➔ Áp biểu giá chính thức TP.HCM:</text>
  <text x="480" y="470" fill="#A7F3D0" font-size="10" font-weight="bold" text-anchor="middle">≤5km: 7.000đ | 5-10km: 12.000đ | 10-15km: 16.000đ | &gt;15km: 20.000đ | Bus: 7.000đ</text>

  <line x1="480" y1="480" x2="480" y2="505" stroke="#0F3E31" stroke-width="1.5"/>
  <polygon points="480,505 475,498 485,498" fill="#0F3E31"/>

  <!-- END -->
  <rect x="360" y="505" width="240" height="35" rx="17.5" fill="#0F3E31" stroke="#082820" stroke-width="1.2"/>
  <text x="480" y="527" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">XUẤT KẾT QUẢ: 3 Thẻ Lộ Trình Tối Ưu</text>
</svg>