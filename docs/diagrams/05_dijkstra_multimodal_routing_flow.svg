  <line x1="480" y1="120" x2="480" y2="148" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="480,148 474,140 486,140" fill="#0F3E31"/>

  <!-- STEP 1 -->
  <rect x="310" y="148" width="340" height="55" rx="4" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.5"/>
  <text x="480" y="172" fill="#0F3E31" font-size="14.5" font-weight="bold" text-anchor="middle">1. Nạp Bản Đồ 14 Ga Metro Số 1 &amp; Tuyến Xe Buýt</text>
  <text x="480" y="193" fill="#555555" font-size="13" text-anchor="middle">(Thông tin khoảng cách, thời gian và trạm trung chuyển)</text>

  <line x1="480" y1="203" x2="480" y2="232" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="480,232 474,224 486,224" fill="#0F3E31"/>

