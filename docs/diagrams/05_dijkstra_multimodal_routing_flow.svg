  <text x="480" y="497" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Dưới 5km: 7.000đ | 5-10km: 12.000đ | 10-15km: 16.000đ | Trên 15km: 20.000đ</text>

  <line x1="480" y1="514" x2="480" y2="538" stroke="#0F3E31" stroke-width="2"/>
