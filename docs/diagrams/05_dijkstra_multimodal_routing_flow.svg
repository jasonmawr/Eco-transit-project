<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <rect x="15" y="10" width="930" height="46" rx="4" fill="#0F3E31" stroke="#082820" stroke-width="1"/>
  <text x="480" y="39" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">
    HÌNH 5. LƯU ĐỒ TÌM ĐƯỜNG ĐI THÔNG MINH &amp; TÍNH ĐÚNG GIÁ VÉ METRO
  </text>

