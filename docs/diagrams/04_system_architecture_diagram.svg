<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <rect x="20" y="15" width="920" height="42" rx="4" fill="#0F3E31" stroke="#082820" stroke-width="1"/>
  <text x="480" y="42" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">
    HÌNH 4. SƠ ĐỒ KIẾN TRÚC HỆ THỐNG 3 TẦNG (3-TIER ARCHITECTURE)
  </text>

  <!-- TIER 1 -->
  <g transform="translate(35, 75)">
