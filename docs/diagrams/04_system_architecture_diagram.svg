    <rect width="270" height="35" rx="4" fill="#1E293B"/>
    <text x="135" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1. TẦNG TRÌNH DIỄN (CLIENT)</text>

    <rect x="15" y="50" width="240" height="60" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="75" fill="#0F172A" font-size="12" font-weight="bold" text-anchor="middle">Next.js 14 App Router</text>
    <text x="135" y="95" fill="#64748B" font-size="11" text-anchor="middle">React 18 SSR &amp; SEO Metadata</text>

    <rect x="15" y="125" width="240" height="65" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="150" fill="#0F172A" font-size="12" font-weight="bold" text-anchor="middle">React Portal Modal Engine</text>
    <text x="135" y="170" fill="#64748B" font-size="11" text-anchor="middle">Gắn document.body chống cắt xén</text>

    <rect x="15" y="205" width="240" height="60" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="230" fill="#0F172A" font-size="12" font-weight="bold" text-anchor="middle">Framer Motion &amp; Canvas</text>
    <text x="135" y="250" fill="#64748B" font-size="11" text-anchor="middle">Xuất poster XanhWrap HD</text>

    <rect x="15" y="280" width="240" height="60" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="305" fill="#0F172A" font-size="12" font-weight="bold" text-anchor="middle">Design Tokens &amp; WCAG AA</text>
    <text x="135" y="325" fill="#64748B" font-size="11" text-anchor="middle">Bảng màu tiêu chuẩn xanh TP.HCM</text>

    <rect x="15" y="355" width="240" height="105" rx="4" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.2"/>
    <text x="135" y="380" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">Triển Khai: VERCEL EDGE</text>
    <text x="135" y="405" fill="#047857" font-size="11.5" font-weight="bold" text-anchor="middle">luotkhoichamxanh.vercel.app</text>
    <text x="135" y="430" fill="#555555" font-size="10.5" text-anchor="middle">Tự động CI/CD từ GitHub main</text>
  </g>

  <!-- TIER 2 -->
  <g transform="translate(345, 75)">
