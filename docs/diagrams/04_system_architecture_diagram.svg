    <rect x="15" y="50" width="240" height="60" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="75" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">Express.js &amp; TypeScript API</text>
    <text x="135" y="95" fill="#64748B" font-size="11" text-anchor="middle">RESTful Endpoints &amp; Rate Limiting</text>

    <rect x="15" y="125" width="240" height="65" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="150" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">Thuật toán Dijkstra &amp; Tariff</text>
    <text x="135" y="170" fill="#64748B" font-size="11" text-anchor="middle">Gộp chặng &amp; Biểu giá 7k-12k-16k-20k</text>

    <rect x="15" y="205" width="240" height="60" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="230" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">Tesseract OCR &amp; Vision</text>
    <text x="135" y="250" fill="#64748B" font-size="11" text-anchor="middle">Đối soát vé Metro &amp; Bus tự động</text>

    <rect x="15" y="280" width="240" height="60" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="305" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">Argon2 Password &amp; JWT</text>
    <text x="135" y="325" fill="#64748B" font-size="11" text-anchor="middle">Bảo mật đa tầng &amp; Phân quyền</text>

    <rect x="15" y="355" width="240" height="105" rx="4" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.2"/>
    <text x="135" y="380" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">Triển Khai: RENDER CLOUD</text>
    <text x="135" y="405" fill="#047857" font-size="11.5" font-weight="bold" text-anchor="middle">api.luotkhoichamxanh.onrender.com</text>
    <text x="135" y="430" fill="#555555" font-size="10.5" text-anchor="middle">Container Node.js 20 LTS</text>
  </g>

  <!-- TIER 3 -->
  <g transform="translate(655, 75)">
    <rect width="270" height="480" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <rect width="270" height="35" rx="4" fill="#92400E"/>
    <text x="135" y="23" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3. TẦNG DỮ LIỆU (DATABASE)</text>

    <rect x="15" y="50" width="240" height="65" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
