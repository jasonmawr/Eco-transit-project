    <text x="135" y="95" fill="#64748B" font-size="11" text-anchor="middle">14 Ga Metro • 21 Địa Điểm • 132 Wraps</text>

    <rect x="15" y="130" width="240" height="65" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="155" fill="#92400E" font-size="12" font-weight="bold" text-anchor="middle">PointsLedger (Sổ Cái)</text>
    <text x="135" y="175" fill="#64748B" font-size="11" text-anchor="middle">45 Lượt đổi Xanh SM • 45 Vé duyệt</text>

    <rect x="15" y="210" width="240" height="65" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="235" fill="#92400E" font-size="12" font-weight="bold" text-anchor="middle">VisitorLog &amp; Analytics</text>
    <text x="135" y="255" fill="#64748B" font-size="11" text-anchor="middle">937 Lượt truy cập Landing Page</text>

    <rect x="15" y="290" width="240" height="65" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="315" fill="#92400E" font-size="12" font-weight="bold" text-anchor="middle">Voucher &amp; Code Vault</text>
    <text x="135" y="335" fill="#64748B" font-size="11" text-anchor="middle">Kho mã quà tặng Xanh SM, Highlands</text>

    <rect x="15" y="370" width="240" height="90" rx="4" fill="#ffffff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="135" y="395" fill="#92400E" font-size="12" font-weight="bold" text-anchor="middle">AuditLog (Kiểm Toán)</text>
    <text x="135" y="415" fill="#64748B" font-size="11" text-anchor="middle">Nhật ký truy vết bảo mật Admin/Mod</text>
  </g>

  <!-- Connectors -->
  <line x1="305" y1="315" x2="345" y2="315" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="345,315 337,310 337,320" fill="#0F3E31"/>

  <line x1="615" y1="315" x2="655" y2="315" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="655,315 647,310 647,320" fill="#0F3E31"/>
</svg>