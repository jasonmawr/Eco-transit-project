<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <rect x="15" y="10" width="970" height="46" rx="4" fill="#0F3E31" stroke="#082820" stroke-width="1"/>
  <text x="500" y="39" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">
    HÌNH 3. QUY TRÌNH DUYỆT VÉ XE &amp; CỘNG ĐIỂM THƯỞNG VÀO VÍ
  </text>

  <!-- Start Circle -->
  <circle cx="45" cy="180" r="16" fill="#0F3E31"/>
  <line x1="61" y1="180" x2="105" y2="180" stroke="#0F3E31" stroke-width="2.5"/>
  <polygon points="105,180 95,174 95,186" fill="#0F3E31"/>

  <!-- State 1: Uploaded -->
  <rect x="105" y="145" width="180" height="70" rx="6" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.8"/>
  <text x="195" y="173" fill="#0F3E31" font-size="15" font-weight="bold" text-anchor="middle">1. Đã Tải Ảnh Vé</text>
  <text x="195" y="196" fill="#555555" font-size="13" text-anchor="middle">(Hệ thống quét đọc thông tin)</text>

  <!-- Arrow to State 2 -->
  <line x1="285" y1="180" x2="340" y2="180" stroke="#0F3E31" stroke-width="2.5"/>
  <polygon points="340,180 330,174 330,186" fill="#0F3E31"/>

  <!-- State 2: Pending Moderation -->
  <rect x="340" y="145" width="180" height="70" rx="6" fill="#FEF9E7" stroke="#B45309" stroke-width="1.8"/>
  <text x="430" y="173" fill="#92400E" font-size="15" font-weight="bold" text-anchor="middle">2. Chờ Xác Thực</text>
  <text x="430" y="196" fill="#555555" font-size="13" text-anchor="middle">(Kiểm tra số vé &amp; ngày đi)</text>

  <!-- TRANSITION 1: VALID (Green Arrow - Generous Gap) -->
  <path d="M 520 160 L 610 115 L 700 115" fill="none" stroke="#059669" stroke-width="2.5"/>
  <polygon points="700,115 690,109 690,121" fill="#059669"/>
  
  <!-- Pill Label for Valid -->
  <rect x="545" y="85" width="115" height="26" rx="13" fill="#D1E7DD" stroke="#059669" stroke-width="1"/>
  <text x="602" y="103" fill="#065F46" font-size="13" font-weight="bold" text-anchor="middle">✓ Vé Hợp Lệ</text>

  <!-- State 3: Approved -->
  <rect x="700" y="80" width="220" height="70" rx="6" fill="#D1E7DD" stroke="#0F3E31" stroke-width="1.8"/>
  <text x="810" y="108" fill="#0F3E31" font-size="16" font-weight="bold" text-anchor="middle">3. Đã Phê Duyệt</text>
  <text x="810" y="131" fill="#047857" font-size="13.5" font-weight="bold" text-anchor="middle">+10 Điểm Vào Ví Thành Viên</text>

  <!-- End Circle Approved -->
  <circle cx="955" cy="115" r="16" fill="#0F3E31"/>
  <circle cx="955" cy="115" r="11" fill="#ffffff"/>
  <line x1="920" y1="115" x2="939" y2="115" stroke="#0F3E31" stroke-width="2"/>

  <!-- TRANSITION 2: INVALID (Red Arrow - Generous Gap) -->
  <path d="M 520 200 L 610 245 L 700 245" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <polygon points="700,245 690,239 690,251" fill="#DC2626"/>

  <!-- Pill Label for Invalid -->
  <rect x="540" y="255" width="125" height="26" rx="13" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="602" y="273" fill="#991B1B" font-size="13" font-weight="bold" text-anchor="middle">✕ Trùng / Lỗi Vé</text>

  <!-- State 4: Rejected -->
  <rect x="700" y="210" width="220" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="810" y="238" fill="#991B1B" font-size="16" font-weight="bold" text-anchor="middle">4. Từ Chối Duyệt</text>
  <text x="810" y="261" fill="#7F1D1D" font-size="13" text-anchor="middle">(Báo lý do cho người dùng)</text>

  <!-- End Circle Rejected -->
  <circle cx="955" cy="245" r="16" fill="#DC2626"/>
  <circle cx="955" cy="245" r="11" fill="#ffffff"/>
  <line x1="920" y1="245" x2="939" y2="245" stroke="#DC2626" stroke-width="2"/>
</svg>