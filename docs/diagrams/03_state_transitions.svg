<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <rect x="15" y="10" width="930" height="46" rx="4" fill="#0F3E31" stroke="#082820" stroke-width="1"/>
  <text x="480" y="39" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">
    HÌNH 3. QUY TRÌNH DUYỆT VÉ XE &amp; CỘNG ĐIỂM THƯỞNG VÀO VÍ
  </text>

  <!-- Start -->
  <circle cx="50" cy="160" r="16" fill="#0F3E31"/>
  <line x1="66" y1="160" x2="120" y2="160" stroke="#0F3E31" stroke-width="2.5"/>
  <polygon points="120,160 110,154 110,166" fill="#0F3E31"/>

  <!-- State 1: Uploaded -->
  <rect x="120" y="125" width="180" height="70" rx="6" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.8"/>
  <text x="210" y="153" fill="#0F3E31" font-size="15" font-weight="bold" text-anchor="middle">1. Đã Tải Ảnh Vé</text>
  <text x="210" y="176" fill="#555555" font-size="13" text-anchor="middle">(Hệ thống quét đọc thông tin)</text>

  <line x1="300" y1="160" x2="360" y2="160" stroke="#0F3E31" stroke-width="2.5"/>
  <polygon points="360,160 350,154 350,166" fill="#0F3E31"/>

  <!-- State 2: Pending Moderation -->
  <rect x="360" y="125" width="200" height="70" rx="6" fill="#FEF9E7" stroke="#B45309" stroke-width="1.8"/>
  <text x="460" y="153" fill="#92400E" font-size="15" font-weight="bold" text-anchor="middle">2. Chờ Xác Thực</text>
  <text x="460" y="176" fill="#555555" font-size="13" text-anchor="middle">(Kiểm tra số vé &amp; ngày đi)</text>

  <!-- Transition Valid -->
  <line x1="560" y1="145" x2="650" y2="110" stroke="#059669" stroke-width="2.5"/>
  <polygon points="650,110 638,109 643,119" fill="#059669"/>
  <text x="605" y="118" fill="#059669" font-size="13" font-weight="bold">Vé Hợp Lệ</text>

  <!-- State 3: Verified -->
  <rect x="650" y="75" width="210" height="70" rx="6" fill="#D1E7DD" stroke="#0F3E31" stroke-width="1.8"/>
  <text x="755" y="103" fill="#0F3E31" font-size="15.5" font-weight="bold" text-anchor="middle">3. Đã Phê Duyệt</text>
  <text x="755" y="126" fill="#047857" font-size="13.5" font-weight="bold" text-anchor="middle">+10 Điểm Vào Ví Thành Viên</text>

  <!-- Transition Invalid -->
  <line x1="560" y1="175" x2="650" y2="210" stroke="#DC2626" stroke-width="2.5"/>
  <polygon points="650,210 643,201 638,211" fill="#DC2626"/>
  <text x="605" y="210" fill="#DC2626" font-size="13" font-weight="bold">Trùng/Sai</text>

  <!-- State 4: Rejected -->
  <rect x="650" y="175" width="210" height="70" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="755" y="203" fill="#991B1B" font-size="15.5" font-weight="bold" text-anchor="middle">4. Từ Chối Duyệt</text>
  <text x="755" y="226" fill="#7F1D1D" font-size="13" text-anchor="middle">(Báo lý do cho người dùng)</text>

  <!-- End Circles -->
  <circle cx="900" cy="110" r="16" fill="#0F3E31"/>
  <circle cx="900" cy="110" r="11" fill="#ffffff"/>
  <line x1="860" y1="110" x2="884" y2="110" stroke="#0F3E31" stroke-width="2"/>

  <circle cx="900" cy="210" r="16" fill="#DC2626"/>
  <circle cx="900" cy="210" r="11" fill="#ffffff"/>
  <line x1="860" y1="210" x2="884" y2="210" stroke="#DC2626" stroke-width="2"/>
</svg>