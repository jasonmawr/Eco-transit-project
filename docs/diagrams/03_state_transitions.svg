<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <rect x="20" y="15" width="920" height="42" rx="4" fill="#0F3E31" stroke="#082820" stroke-width="1"/>
  <text x="480" y="42" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">
    HÌNH 3. SƠ ĐỒ MÁY CHUYỂN TRẠNG THÁI KIỂM DUYỆT VÉ &amp; TÍCH ĐIỂM (STATE MACHINE)
  </text>

  <!-- Start -->
  <circle cx="60" cy="150" r="14" fill="#0F3E31"/>
  <line x1="74" y1="150" x2="140" y2="150" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="140,150 132,145 132,155" fill="#0F3E31"/>

  <!-- State 1: Uploaded -->
  <rect x="140" y="120" width="160" height="60" rx="6" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.5"/>
  <text x="220" y="145" fill="#0F3E31" font-size="13" font-weight="bold" text-anchor="middle">1. Đã Tải Lên</text>
  <text x="220" y="165" fill="#555555" font-size="11" text-anchor="middle">(Tesseract OCR Quét)</text>

  <line x1="300" y1="150" x2="380" y2="150" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="380,150 372,145 372,155" fill="#0F3E31"/>

  <!-- State 2: Pending Moderation -->
  <rect x="380" y="120" width="190" height="60" rx="6" fill="#FEF9E7" stroke="#B45309" stroke-width="1.5"/>
  <text x="475" y="145" fill="#92400E" font-size="13" font-weight="bold" text-anchor="middle">2. Chờ Kiểm Duyệt</text>
  <text x="475" y="165" fill="#555555" font-size="11" text-anchor="middle">(Đối soát số vé &amp; ngày đi)</text>

  <!-- Transition Valid -->
  <line x1="570" y1="135" x2="660" y2="105" stroke="#059669" stroke-width="2"/>
  <polygon points="660,105 650,104 654,113" fill="#059669"/>
  <text x="615" y="112" fill="#059669" font-size="11" font-weight="bold">Hợp lệ</text>

  <!-- State 3: Verified -->
  <rect x="660" y="75" width="190" height="60" rx="6" fill="#D1E7DD" stroke="#0F3E31" stroke-width="1.5"/>
  <text x="755" y="100" fill="#0F3E31" font-size="13" font-weight="bold" text-anchor="middle">3. Đã Phê Duyệt (Verified)</text>
  <text x="755" y="120" fill="#047857" font-size="11" font-weight="bold">+10 Điểm Sổ Cái PointsLedger</text>

  <!-- Transition Invalid -->
  <line x1="570" y1="165" x2="660" y2="195" stroke="#DC2626" stroke-width="2"/>
  <polygon points="660,195 654,187 650,196" fill="#DC2626"/>
  <text x="615" y="195" fill="#DC2626" font-size="11" font-weight="bold">Trùng/Sai</text>

  <!-- State 4: Rejected -->
  <rect x="660" y="165" width="190" height="60" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="755" y="190" fill="#991B1B" font-size="13" font-weight="bold" text-anchor="middle">4. Từ Chối (Rejected)</text>
  <text x="755" y="210" fill="#7F1D1D" font-size="11" text-anchor="middle">Thông báo lý do từ chối</text>

  <!-- End Circles -->
  <circle cx="895" cy="105" r="14" fill="#0F3E31"/>
  <circle cx="895" cy="105" r="10" fill="#ffffff"/>
  <line x1="850" y1="105" x2="881" y2="105" stroke="#0F3E31" stroke-width="2"/>

  <circle cx="895" cy="195" r="14" fill="#DC2626"/>
  <circle cx="895" cy="195" r="10" fill="#ffffff"/>
  <line x1="850" y1="195" x2="881" y2="195" stroke="#DC2626" stroke-width="2"/>
</svg>