<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="gradFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F3E31" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadowFlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect x="20" y="15" width="960" height="50" rx="12" fill="url(#gradFlow)" filter="url(#shadowFlow)"/>
  <text x="500" y="46" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1">
    LƯU ĐỒ THUẬT TOÁN LẬP LỘ TRÌNH &amp; TÍNH GIÁ VÉ GỘP CHUẨN (DIJKSTRA TARIFF FLOWCHART)
  </text>

  <!-- START -->
  <rect x="400" y="85" width="200" height="45" rx="22.5" fill="#10B981" stroke="#047857" stroke-width="2" filter="url(#shadowFlow)"/>
  <text x="500" y="113" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">BẮT ĐẦU: Nhập Điểm Đi / Đến</text>

  <line x1="500" y1="130" x2="500" y2="155" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="500,155 495,147 505,147" fill="#0F3E31"/>

  <!-- STEP 1: LOAD GRAPH -->
  <rect x="360" y="155" width="280" height="50" rx="10" fill="#E6F7F0" stroke="#10B981" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <text x="500" y="177" fill="#0F3E31" font-size="12" font-weight="700" text-anchor="middle">Nạp Đồ Thị: 14 Ga Metro 1 &amp; Tuyến Bus</text>
  <text x="500" y="193" fill="#6B7280" font-size="10" text-anchor="middle">RouteEdges: Khoảng cách, Thời gian, Phương thức</text>

  <line x1="500" y1="205" x2="500" y2="230" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="500,230 495,222 505,222" fill="#0F3E31"/>

  <!-- DECISION 1: WEATHER CONTEXT -->
  <polygon points="500,230 630,275 500,320 370,275" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <text x="500" y="270" fill="#92400E" font-size="11" font-weight="700" text-anchor="middle">Context Thời Tiết?</text>
  <text x="500" y="286" fill="#92400E" font-size="10" text-anchor="middle">(Mưa / Nắng nóng / Ban đêm)</text>

  <!-- WEATHER BRANCH -->
  <line x1="630" y1="275" x2="740" y2="275" stroke="#F59E0B" stroke-width="1.5"/>
  <polygon points="740,275 732,270 732,280" fill="#F59E0B"/>
  <rect x="740" y="250" width="220" height="50" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="850" y="270" fill="#92400E" font-size="11" font-weight="700" text-anchor="middle">Tăng trọng số Đi bộ (+50%)</text>
  <text x="850" y="288" fill="#92400E" font-size="10" text-anchor="middle">Ưu tiên hầm ngầm Metro 1 mát mẻ</text>

  <line x1="850" y1="300" x2="850" y2="350" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="850" y1="350" x2="500" y2="350" stroke="#F59E0B" stroke-width="1.5"/>

  <line x1="500" y1="320" x2="500" y2="365" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="500,365 495,357 505,357" fill="#0F3E31"/>

  <!-- STEP 2: DIJKSTRA SEARCH -->
  <rect x="360" y="365" width="280" height="50" rx="10" fill="#E6F7F0" stroke="#10B981" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <text x="500" y="387" fill="#0F3E31" font-size="12" font-weight="700" text-anchor="middle">Dijkstra: Tìm 3 Đường Đi Ngắn Nhất</text>
  <text x="500" y="403" fill="#6B7280" font-size="10" text-anchor="middle">Tính tổng thời gian &amp; số lần chuyển tuyến</text>

  <line x1="500" y1="415" x2="500" y2="440" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="500,440 495,432 505,432" fill="#0F3E31"/>

  <!-- STEP 3: CONSOLIDATE LEGS & TARIFF CALC -->
  <rect x="300" y="440" width="400" height="75" rx="12" fill="#0F3E31" stroke="#10B981" stroke-width="2" filter="url(#shadowFlow)"/>
  <text x="500" y="465" fill="#10B981" font-size="13" font-weight="800" text-anchor="middle">consolidateLegs() &amp; calculateMetroFare()</text>
  <text x="500" y="485" fill="#ffffff" font-size="11" text-anchor="middle">Gộp chặng liên tục ➔ Áp biểu giá chính thức TP.HCM:</text>
  <text x="500" y="502" fill="#A7F3D0" font-size="10" font-weight="700" text-anchor="middle">≤5km: 7.000đ | 5-10km: 12.000đ | 10-15km: 16.000đ | &gt;15km: 20.000đ</text>

  <line x1="500" y1="515" x2="500" y2="545" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="500,545 495,537 505,537" fill="#0F3E31"/>

  <!-- OUTPUT: RETURN TOP 3 ROUTES -->
  <rect x="340" y="545" width="320" height="50" rx="10" fill="#E6F7F0" stroke="#059669" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <text x="500" y="567" fill="#0F3E31" font-size="12" font-weight="700" text-anchor="middle">XUẤT KẾT QUẢ: 3 Thẻ Lộ Trình Hoàn Chỉnh</text>
  <text x="500" y="583" fill="#6B7280" font-size="10" text-anchor="middle">Kèm lượng CO₂ giảm &amp; Hóa đơn thời gian xanh</text>

  <line x1="500" y1="595" x2="500" y2="620" stroke="#0F3E31" stroke-width="2"/>
  <polygon points="500,620 495,612 505,612" fill="#0F3E31"/>

  <!-- END -->
  <rect x="420" y="620" width="160" height="35" rx="17.5" fill="#10B981" stroke="#047857" stroke-width="1.5"/>
  <text x="500" y="642" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">KẾT THÚC</text>
</svg>