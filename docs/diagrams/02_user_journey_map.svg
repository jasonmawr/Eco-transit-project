    <text x="757" y="118" fill="#333" font-size="13.5">- Tải ảnh poster đẹp về máy</text>
    <text x="757" y="141" fill="#333" font-size="13.5">- Đăng lên Story Facebook</text>

    <text x="750" y="180" fill="#111" font-size="14" font-weight="bold">• Kết quả nhận được:</text>
    <text x="757" y="205" fill="#0F3E31" font-size="13.5">- Kèm #LuotKhoiChamXanh</text>
    <text x="757" y="228" fill="#0F3E31" font-size="13.5">- Rủ bạn bè cùng đi tàu</text>

    <text x="847" y="278" fill="#059669" font-size="14" font-weight="bold" text-anchor="middle">⭐ Mức hài lòng: 5/5</text>
