    <text x="357" y="27" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">2. Đi Tàu Thực Tế</text>
    
    <text x="260" y="70" fill="#111" font-size="14" font-weight="bold">• Người dùng làm gì:</text>
