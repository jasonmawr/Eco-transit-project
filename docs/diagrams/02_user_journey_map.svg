<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <rect x="15" y="10" width="970" height="46" rx="4" fill="#0F3E31" stroke="#082820" stroke-width="1"/>
  <text x="500" y="39" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">
    HÌNH 2. BẢN ĐỒ TRẢI NGHIỆM CỦA NGƯỜI DÙNG (USER JOURNEY MAP — GEN Z)
  </text>

  <!-- 4 PHASES -->
  <g transform="translate(20, 70)">
    <!-- Phase 1 -->
    <rect x="0" y="0" width="225" height="305" rx="6" fill="#F9FBFA" stroke="#D1E7DD" stroke-width="1.5"/>
    <rect x="0" y="0" width="225" height="42" rx="6" fill="#0F3E31"/>
    <text x="112" y="27" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">1. Tìm Đường &amp; Giá Vé</text>
    
    <text x="15" y="70" fill="#111" font-size="14" font-weight="bold">• Người dùng làm gì:</text>
    <text x="22" y="95" fill="#333" font-size="13.5">- Mở web trên điện thoại</text>
    <text x="22" y="118" fill="#333" font-size="13.5">- Nhập KTX ĐHQG ➔ Bến Thành</text>
