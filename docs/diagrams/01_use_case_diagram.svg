<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <!-- Header Title -->
  <rect x="15" y="10" width="970" height="46" rx="4" fill="#0F3E31" stroke="#082820" stroke-width="1"/>
  <text x="500" y="39" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    HÌNH 1. SƠ ĐỒ CHỨC NĂNG NGHIỆP VỤ HỆ THỐNG — LƯỚT KHÓI CHẠM XANH
  </text>

  <!-- System Boundary -->
  <rect x="230" y="70" width="540" height="575" rx="6" fill="#FAFCFB" stroke="#0F3E31" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="500" y="96" fill="#0F3E31" font-size="15.5" font-weight="bold" text-anchor="middle">
    CÁC TÍNH NĂNG TRÊN ỨNG DỤNG LƯỚT KHÓI CHẠM XANH
  </text>

  <!-- ACTOR 1 (Left) -->
  <g transform="translate(70, 240)">
    <circle cx="35" cy="20" r="18" fill="#ffffff" stroke="#0F3E31" stroke-width="2.5"/>
    <line x1="35" y1="38" x2="35" y2="95" stroke="#0F3E31" stroke-width="3"/>
    <line x1="35" y1="55" x2="0" y2="45" stroke="#0F3E31" stroke-width="3"/>
    <line x1="35" y1="55" x2="70" y2="45" stroke="#0F3E31" stroke-width="3"/>
    <line x1="35" y1="95" x2="2" y2="145" stroke="#0F3E31" stroke-width="3"/>
    <line x1="35" y1="95" x2="68" y2="145" stroke="#0F3E31" stroke-width="3"/>
    <text x="35" y="172" fill="#0F3E31" font-size="16.5" font-weight="bold" text-anchor="middle">Người Đi Xe / Gen Z</text>
    <text x="35" y="193" fill="#555555" font-size="13.5" font-style="italic" text-anchor="middle">(Hành khách)</text>
  </g>

  <!-- ACTOR 2 (Right) -->
  <g transform="translate(860, 240)">
    <circle cx="35" cy="20" r="18" fill="#ffffff" stroke="#4C1D95" stroke-width="2.5"/>
    <line x1="35" y1="38" x2="35" y2="95" stroke="#4C1D95" stroke-width="3"/>
    <line x1="35" y1="55" x2="0" y2="45" stroke="#4C1D95" stroke-width="3"/>
    <line x1="35" y1="55" x2="70" y2="45" stroke="#4C1D95" stroke-width="3"/>
    <line x1="35" y1="95" x2="2" y2="145" stroke="#4C1D95" stroke-width="3"/>
    <line x1="35" y1="95" x2="68" y2="145" stroke="#4C1D95" stroke-width="3"/>
    <text x="35" y="172" fill="#4C1D95" font-size="16.5" font-weight="bold" text-anchor="middle">Ban Quản Trị</text>
    <text x="35" y="193" fill="#555555" font-size="13.5" font-style="italic" text-anchor="middle">(Kiểm duyệt viên)</text>
  </g>

  <!-- USE CASES (Centered in Boundary) -->
  <g transform="translate(300, 115)">
    <ellipse cx="200" cy="24" rx="185" ry="26" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.5"/>
    <text x="200" y="30" fill="#0F3E31" font-size="14.5" font-weight="bold" text-anchor="middle">1. Tìm &amp; Tối Ưu Lộ Trình Đi Lại</text>
  </g>

  <g transform="translate(300, 185)">
    <ellipse cx="200" cy="24" rx="185" ry="26" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.5"/>
    <text x="200" y="30" fill="#0F3E31" font-size="14.5" font-weight="bold" text-anchor="middle">2. Khám Phá 21 Ga &amp; Mở Khóa Địa Điểm</text>
  </g>

  <g transform="translate(300, 255)">
    <ellipse cx="200" cy="24" rx="185" ry="26" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.5"/>
    <text x="200" y="30" fill="#0F3E31" font-size="14.5" font-weight="bold" text-anchor="middle">3. Chụp Vé Xe Tích Điểm Thưởng</text>
  </g>

  <g transform="translate(300, 325)">
    <ellipse cx="200" cy="24" rx="185" ry="26" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.5"/>
    <text x="200" y="30" fill="#0F3E31" font-size="14.5" font-weight="bold" text-anchor="middle">4. Đổi Voucher Xanh SM &amp; Quà Tặng</text>
  </g>

  <g transform="translate(300, 395)">
    <ellipse cx="200" cy="24" rx="185" ry="26" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.5"/>
    <text x="200" y="30" fill="#0F3E31" font-size="14.5" font-weight="bold" text-anchor="middle">5. Tạo Hóa Đơn XanhWrap &amp; Quay Thưởng</text>
  </g>

  <g transform="translate(300, 470)">
    <ellipse cx="200" cy="24" rx="185" ry="26" fill="#F3EEFA" stroke="#4C1D95" stroke-width="1.5"/>
    <text x="200" y="30" fill="#4C1D95" font-size="14.5" font-weight="bold" text-anchor="middle">6. Duyệt Vé Xe Thật &amp; Cộng Điểm Ví</text>
  </g>

  <g transform="translate(300, 545)">
    <ellipse cx="200" cy="24" rx="185" ry="26" fill="#F3EEFA" stroke="#4C1D95" stroke-width="1.5"/>
    <text x="200" y="30" fill="#4C1D95" font-size="14.5" font-weight="bold" text-anchor="middle">7. Xem Thống Kê 937 Lượt &amp; Nhật Ký</text>
  </g>

  <!-- Connectors (Carefully stopping before ellipse boundaries) -->
  <line x1="140" y1="285" x2="315" y2="139" stroke="#0F3E31" stroke-width="1.5"/>
  <line x1="140" y1="285" x2="315" y2="209" stroke="#0F3E31" stroke-width="1.5"/>
  <line x1="140" y1="285" x2="315" y2="279" stroke="#0F3E31" stroke-width="1.5"/>
  <line x1="140" y1="285" x2="315" y2="349" stroke="#0F3E31" stroke-width="1.5"/>
  <line x1="140" y1="285" x2="315" y2="419" stroke="#0F3E31" stroke-width="1.5"/>

  <line x1="860" y1="285" x2="685" y2="349" stroke="#4C1D95" stroke-width="1.5"/>
  <line x1="860" y1="285" x2="685" y2="494" stroke="#4C1D95" stroke-width="1.5"/>
  <line x1="860" y1="285" x2="685" y2="569" stroke="#4C1D95" stroke-width="1.5"/>
</svg>