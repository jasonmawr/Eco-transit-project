<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F3E31" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="gradUseCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F7F0" />
      <stop offset="100%" stop-color="#C5EFE0" />
    </linearGradient>
    <linearGradient id="gradAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title & Banner -->
  <rect x="20" y="15" width="960" height="50" rx="12" fill="url(#gradHeader)" filter="url(#shadow)"/>
  <text x="500" y="46" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1">
    SƠ ĐỒ USE CASE TỔNG THỂ HỆ THỐNG — LƯỚT KHÓI CHẠM XANH (UML USE CASE DIAGRAM)
  </text>

  <!-- System Boundary Boundary Box -->
  <rect x="240" y="80" width="520" height="570" rx="18" fill="#F8FAF9" stroke="#10B981" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="500" y="105" fill="#0F3E31" font-size="14" font-weight="800" text-anchor="middle">
    HỆ THỐNG ỨNG DỤNG LƯỚT KHÓI CHẠM XANH (SYSTEM BOUNDARY)
  </text>

  <!-- ACTOR 1: NGƯỜI DÙNG / HÀNH KHÁCH (Left) -->
  <g transform="translate(100, 240)">
    <!-- Stick Figure -->
    <circle cx="20" cy="15" r="14" fill="#0F3E31" stroke="#10B981" stroke-width="2"/>
    <line x1="20" y1="29" x2="20" y2="75" stroke="#0F3E31" stroke-width="3"/>
    <line x1="20" y1="45" x2="-5" y2="35" stroke="#0F3E31" stroke-width="3"/>
    <line x1="20" y1="45" x2="45" y2="35" stroke="#0F3E31" stroke-width="3"/>
    <line x1="20" y1="75" x2="-2" y2="115" stroke="#0F3E31" stroke-width="3"/>
    <line x1="20" y1="75" x2="42" y2="115" stroke="#0F3E31" stroke-width="3"/>
    <text x="20" y="135" fill="#0F3E31" font-size="13" font-weight="800" text-anchor="middle">Hành Khách / Gen Z</text>
    <text x="20" y="150" fill="#6B7280" font-size="11" font-weight="600" text-anchor="middle">&lt;&lt;Actor&gt;&gt;</text>
  </g>

  <!-- ACTOR 2: QUẢN TRỊ VIÊN / ADMIN (Right) -->
  <g transform="translate(860, 240)">
    <!-- Stick Figure -->
    <circle cx="20" cy="15" r="14" fill="#7C3AED" stroke="#5B21B6" stroke-width="2"/>
    <line x1="20" y1="29" x2="20" y2="75" stroke="#7C3AED" stroke-width="3"/>
    <line x1="20" y1="45" x2="-5" y2="35" stroke="#7C3AED" stroke-width="3"/>
    <line x1="20" y1="45" x2="45" y2="35" stroke="#7C3AED" stroke-width="3"/>
    <line x1="20" y1="75" x2="-2" y2="115" stroke="#7C3AED" stroke-width="3"/>
    <line x1="20" y1="75" x2="42" y2="115" stroke="#7C3AED" stroke-width="3"/>
    <text x="20" y="135" fill="#7C3AED" font-size="13" font-weight="800" text-anchor="middle">Quản Trị Viên (Admin)</text>
    <text x="20" y="150" fill="#6B7280" font-size="11" font-weight="600" text-anchor="middle">&lt;&lt;Actor&gt;&gt;</text>
  </g>

  <!-- USE CASES (Ellipses) -->
  <g filter="url(#shadow)">
    <ellipse cx="500" cy="150" rx="160" ry="26" fill="url(#gradUseCase)" stroke="#059669" stroke-width="1.5"/>
    <text x="500" y="155" fill="#0F3E31" font-size="12" font-weight="700" text-anchor="middle">UC01: Tra cứu &amp; Tối ưu Lộ trình Xanh</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="500" cy="220" rx="160" ry="26" fill="url(#gradUseCase)" stroke="#059669" stroke-width="1.5"/>
    <text x="500" y="225" fill="#0F3E31" font-size="12" font-weight="700" text-anchor="middle">UC02: Khám phá 21 Ga &amp; Mở khóa Cấp độ</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="500" cy="290" rx="160" ry="26" fill="url(#gradUseCase)" stroke="#059669" stroke-width="1.5"/>
    <text x="500" y="295" fill="#0F3E31" font-size="12" font-weight="700" text-anchor="middle">UC03: Tải ảnh vé &amp; Nhận dạng OCR Tích điểm</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="500" cy="360" rx="160" ry="26" fill="url(#gradUseCase)" stroke="#059669" stroke-width="1.5"/>
    <text x="500" y="365" fill="#0F3E31" font-size="12" font-weight="700" text-anchor="middle">UC04: Đổi Voucher Xanh SM &amp; Đối tác</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="500" cy="430" rx="160" ry="26" fill="url(#gradUseCase)" stroke="#059669" stroke-width="1.5"/>
    <text x="500" y="435" fill="#0F3E31" font-size="12" font-weight="700" text-anchor="middle">UC05: Tạo Hóa đơn XanhWrap &amp; Quay số</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="500" cy="510" rx="160" ry="26" fill="url(#gradAdmin)" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="500" y="515" fill="#5B21B6" font-size="12" font-weight="700" text-anchor="middle">UC06: Kiểm duyệt Vé Xanh &amp; Đối soát</text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="500" cy="580" rx="160" ry="26" fill="url(#gradAdmin)" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="500" y="585" fill="#5B21B6" font-size="12" font-weight="700" text-anchor="middle">UC07: Giám sát Chỉ số Vận hành &amp; Audit Logs</text>
  </g>

  <!-- Connectors -->
  <line x1="140" y1="280" x2="340" y2="150" stroke="#059669" stroke-width="1.5"/>
  <line x1="140" y1="280" x2="340" y2="220" stroke="#059669" stroke-width="1.5"/>
  <line x1="140" y1="280" x2="340" y2="290" stroke="#059669" stroke-width="1.5"/>
  <line x1="140" y1="280" x2="340" y2="360" stroke="#059669" stroke-width="1.5"/>
  <line x1="140" y1="280" x2="340" y2="430" stroke="#059669" stroke-width="1.5"/>

  <line x1="860" y1="280" x2="660" y2="360" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="860" y1="280" x2="660" y2="510" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="860" y1="280" x2="660" y2="580" stroke="#7C3AED" stroke-width="1.5"/>
</svg>