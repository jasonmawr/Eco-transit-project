<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif;">
  <!-- Title -->
  <rect x="20" y="15" width="920" height="42" rx="4" fill="#0F3E31" stroke="#082820" stroke-width="1"/>
  <text x="480" y="42" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    HÌNH 1. SƠ ĐỒ USE CASE TỔNG THỂ HỆ THỐNG — LƯỚT KHÓI CHẠM XANH (UML USE CASE)
  </text>

  <!-- Boundary -->
  <rect x="230" y="75" width="500" height="525" rx="4" fill="#FAFCFB" stroke="#0F3E31" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="480" y="98" fill="#0F3E31" font-size="13" font-weight="bold" text-anchor="middle">
    PHẠM VI HỆ THỐNG LƯỚT KHÓI CHẠM XANH (SYSTEM BOUNDARY)
  </text>

  <!-- ACTOR 1 -->
  <g transform="translate(90, 220)">
    <circle cx="20" cy="15" r="14" fill="#ffffff" stroke="#0F3E31" stroke-width="2"/>
    <line x1="20" y1="29" x2="20" y2="75" stroke="#0F3E31" stroke-width="2.5"/>
    <line x1="20" y1="45" x2="-5" y2="35" stroke="#0F3E31" stroke-width="2.5"/>
    <line x1="20" y1="45" x2="45" y2="35" stroke="#0F3E31" stroke-width="2.5"/>
    <line x1="20" y1="75" x2="-2" y2="115" stroke="#0F3E31" stroke-width="2.5"/>
    <line x1="20" y1="75" x2="42" y2="115" stroke="#0F3E31" stroke-width="2.5"/>
    <text x="20" y="135" fill="#0F3E31" font-size="13" font-weight="bold" text-anchor="middle">Hành Khách (Gen Z)</text>
    <text x="20" y="150" fill="#555555" font-size="11" font-style="italic" text-anchor="middle">&lt;&lt;Actor&gt;&gt;</text>
  </g>

  <!-- ACTOR 2 -->
  <g transform="translate(830, 220)">
    <circle cx="20" cy="15" r="14" fill="#ffffff" stroke="#0F3E31" stroke-width="2"/>
    <line x1="20" y1="29" x2="20" y2="75" stroke="#0F3E31" stroke-width="2.5"/>
    <line x1="20" y1="45" x2="-5" y2="35" stroke="#0F3E31" stroke-width="2.5"/>
    <line x1="20" y1="45" x2="45" y2="35" stroke="#0F3E31" stroke-width="2.5"/>
    <line x1="20" y1="75" x2="-2" y2="115" stroke="#0F3E31" stroke-width="2.5"/>
    <line x1="20" y1="75" x2="42" y2="115" stroke="#0F3E31" stroke-width="2.5"/>
    <text x="20" y="135" fill="#0F3E31" font-size="13" font-weight="bold" text-anchor="middle">Quản Trị Viên (Admin)</text>
    <text x="20" y="150" fill="#555555" font-size="11" font-style="italic" text-anchor="middle">&lt;&lt;Actor&gt;&gt;</text>
  </g>

  <!-- USE CASES -->
  <g transform="translate(300, 120)">
    <ellipse cx="180" cy="20" rx="160" ry="24" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.2"/>
    <text x="180" y="25" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">UC01: Tra cứu &amp; Tối ưu Lộ trình Xanh</text>
  </g>

  <g transform="translate(300, 185)">
    <ellipse cx="180" cy="20" rx="160" ry="24" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.2"/>
    <text x="180" y="25" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">UC02: Khám phá 21 Ga &amp; Mở khóa Cấp độ</text>
  </g>

  <g transform="translate(300, 250)">
    <ellipse cx="180" cy="20" rx="160" ry="24" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.2"/>
    <text x="180" y="25" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">UC03: Quét Vé OCR &amp; Tích Điểm Xanh</text>
  </g>

  <g transform="translate(300, 315)">
    <ellipse cx="180" cy="20" rx="160" ry="24" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.2"/>
    <text x="180" y="25" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">UC04: Đổi Voucher Xanh SM &amp; Quà Tặng</text>
  </g>

  <g transform="translate(300, 380)">
    <ellipse cx="180" cy="20" rx="160" ry="24" fill="#EBF6F0" stroke="#0F3E31" stroke-width="1.2"/>
    <text x="180" y="25" fill="#0F3E31" font-size="12" font-weight="bold" text-anchor="middle">UC05: Tạo Hóa Đơn XanhWrap &amp; Quay Số</text>
  </g>

  <g transform="translate(300, 450)">
    <ellipse cx="180" cy="20" rx="160" ry="24" fill="#F3EEFA" stroke="#4C1D95" stroke-width="1.2"/>
    <text x="180" y="25" fill="#4C1D95" font-size="12" font-weight="bold" text-anchor="middle">UC06: Kiểm Duyệt Vé Xanh &amp; Đối Soát</text>
  </g>

  <g transform="translate(300, 515)">
    <ellipse cx="180" cy="20" rx="160" ry="24" fill="#F3EEFA" stroke="#4C1D95" stroke-width="1.2"/>
    <text x="180" y="25" fill="#4C1D95" font-size="12" font-weight="bold" text-anchor="middle">UC07: Giám Sát Chỉ Số 937 Lượt &amp; Audit Logs</text>
  </g>

  <!-- Connectors -->
  <line x1="130" y1="260" x2="320" y2="140" stroke="#0F3E31" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="320" y2="205" stroke="#0F3E31" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="320" y2="270" stroke="#0F3E31" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="320" y2="335" stroke="#0F3E31" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="320" y2="400" stroke="#0F3E31" stroke-width="1.2"/>

  <line x1="830" y1="260" x2="640" y2="335" stroke="#4C1D95" stroke-width="1.2"/>
  <line x1="830" y1="260" x2="640" y2="470" stroke="#4C1D95" stroke-width="1.2"/>
  <line x1="830" y1="260" x2="640" y2="535" stroke="#4C1D95" stroke-width="1.2"/>
</svg>