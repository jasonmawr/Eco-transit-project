    <text x="140" y="340" fill="#6B7280" font-size="10" text-anchor="middle">Bảo mật đa tầng &amp; Phân quyền Role</text>

    <rect x="15" y="375" width="250" height="65" rx="10" fill="#ffffff" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="140" y="400" fill="#065F46" font-size="12" font-weight="700" text-anchor="middle">Idempotency &amp; Points Ledger</text>
    <text x="140" y="420" fill="#6B7280" font-size="10" text-anchor="middle">Chống trừ trùng lặp điểm đổi voucher</text>

    <rect x="15" y="455" width="250" height="80" rx="10" fill="#ffffff" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="140" y="480" fill="#065F46" font-size="12" font-weight="700" text-anchor="middle">Deployment: RENDER CLOUD</text>
    <text x="140" y="500" fill="#10B981" font-size="11" font-weight="700" text-anchor="middle">api.luotkhoichamxanh.onrender.com</text>
    <text x="140" y="520" fill="#6B7280" font-size="10" text-anchor="middle">Container Node.js 20 LTS</text>
