    <text x="140" y="180" fill="#6B7280" font-size="10" text-anchor="middle">Gộp chặng &amp; Biểu giá 7k-12k-16k-20k</text>

    <rect x="15" y="215" width="250" height="65" rx="10" fill="#ffffff" stroke="#A7F3D0" stroke-width="1.5"/>
