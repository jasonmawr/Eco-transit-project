    <rect width="280" height="40" rx="16" fill="#F59E0B"/>
    <text x="140" y="26" fill="#78350F" font-size="14" font-weight="800" text-anchor="middle">3. TẦNG DỮ LIỆU (DATABASE)</text>

    <rect x="15" y="55" width="250" height="90" rx="10" fill="#ffffff" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="140" y="80" fill="#92400E" font-size="12" font-weight="700" text-anchor="middle">PostgreSQL Database</text>
    <text x="140" y="100" fill="#6B7280" font-size="10" text-anchor="middle">Prisma ORM Client Models</text>
    <text x="140" y="120" fill="#10B981" font-size="10" font-weight="600" text-anchor="middle">14 Ga Metro • 21 Địa Điểm • 132 Wraps</text>

    <rect x="15" y="160" width="250" height="85" rx="10" fill="#ffffff" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="140" y="185" fill="#92400E" font-size="12" font-weight="700" text-anchor="middle">PointsLedger (Sổ Cái Bất Biến)</text>
    <text x="140" y="205" fill="#6B7280" font-size="10" text-anchor="middle">Ghi nhận delta cộng/trừ điểm minh bạch</text>
    <text x="140" y="225" fill="#6B7280" font-size="10" text-anchor="middle">45 Lượt đổi Xanh SM • 45 Vé duyệt</text>

    <rect x="15" y="260" width="250" height="80" rx="10" fill="#ffffff" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="140" y="285" fill="#92400E" font-size="12" font-weight="700" text-anchor="middle">VisitorLog &amp; Analytics Store</text>
    <text x="140" y="305" fill="#6B7280" font-size="10" text-anchor="middle">937 Lượt truy cập Landing Page</text>
    <text x="140" y="325" fill="#6B7280" font-size="10" text-anchor="middle">Giám sát IP Hash &amp; User Agent</text>

    <rect x="15" y="355" width="250" height="75" rx="10" fill="#ffffff" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="140" y="380" fill="#92400E" font-size="12" font-weight="700" text-anchor="middle">Voucher &amp; Code Vault</text>
    <text x="140" y="400" fill="#6B7280" font-size="10" text-anchor="middle">Kho mã quà tặng Xanh SM, Highlands...</text>
    <text x="140" y="420" fill="#6B7280" font-size="10" text-anchor="middle">Mã hóa đối soát thời gian thực</text>

    <rect x="15" y="445" width="250" height="90" rx="10" fill="#ffffff" stroke="#FDE68A" stroke-width="1.5"/>
    <text x="140" y="470" fill="#92400E" font-size="12" font-weight="700" text-anchor="middle">AuditLog (Nhật Ký Kiểm Toán)</text>
    <text x="140" y="490" fill="#6B7280" font-size="10" text-anchor="middle">Vết thao tác bảo mật Admin/Mod</text>
    <text x="140" y="510" fill="#6B7280" font-size="10" text-anchor="middle">Truy vết IP, thời gian &amp; payload</text>
  </g>

  <!-- Connectors -->
  <line x1="320" y1="365" x2="360" y2="365" stroke="#0F3E31" stroke-width="3" stroke-dasharray="4,2"/>
  <polygon points="360,365 352,360 352,370" fill="#0F3E31"/>

  <line x1="640" y1="365" x2="680" y2="365" stroke="#0F3E31" stroke-width="3" stroke-dasharray="4,2"/>
  <polygon points="680,365 672,360 672,370" fill="#0F3E31"/>
</svg>