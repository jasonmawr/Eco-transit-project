<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeaderArch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F3E31" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradClient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="gradAPI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="gradDB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="shadowArch" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect x="20" y="15" width="960" height="50" rx="12" fill="url(#gradHeaderArch)" filter="url(#shadowArch)"/>
  <text x="500" y="46" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1">
    SƠ ĐỒ KIẾN TRÚC HỆ THỐNG 3 TẦNG (3-TIER ARCHITECTURE DIAGRAM) — LƯỚT KHÓI CHẠM XANH
  </text>

  <!-- TIER 1 -->
  <g transform="translate(40, 85)" filter="url(#shadowArch)">
    <rect width="280" height="560" rx="16" fill="url(#gradClient)" stroke="#3B82F6" stroke-width="2"/>
    <rect width="280" height="40" rx="16" fill="#3B82F6"/>
    <text x="140" y="26" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">1. TẦNG TRÌNH DIỄN (FRONTEND)</text>
    
    <rect x="15" y="55" width="250" height="60" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="140" y="80" fill="#1E3A8A" font-size="12" font-weight="700" text-anchor="middle">Next.js 14 App Router (React 18)</text>
    <text x="140" y="100" fill="#6B7280" font-size="10" text-anchor="middle">Server Components &amp; SEO SSR</text>

    <rect x="15" y="130" width="250" height="65" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="140" y="155" fill="#1E3A8A" font-size="12" font-weight="700" text-anchor="middle">React Portal Windowing Engine</text>
    <text x="140" y="175" fill="#6B7280" font-size="10" text-anchor="middle">document.body Modal Anti-clipping</text>

    <rect x="15" y="210" width="250" height="65" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="140" y="235" fill="#1E3A8A" font-size="12" font-weight="700" text-anchor="middle">Framer Motion &amp; Canvas Renderer</text>
    <text x="140" y="255" fill="#6B7280" font-size="10" text-anchor="middle">Xuất ảnh Poster XanhWrap HD</text>

    <rect x="15" y="290" width="250" height="65" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="140" y="315" fill="#1E3A8A" font-size="12" font-weight="700" text-anchor="middle">Tailwind CSS &amp; Design Tokens</text>
    <text x="140" y="335" fill="#6B7280" font-size="10" text-anchor="middle">WCAG 2.1 AA Palette Tokens</text>

    <rect x="15" y="370" width="250" height="65" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="140" y="395" fill="#1E3A8A" font-size="12" font-weight="700" text-anchor="middle">Audio Web API Sound FX</text>
    <text x="140" y="415" fill="#6B7280" font-size="10" text-anchor="middle">Âm thanh chuông Metro Line 1</text>

    <rect x="15" y="450" width="250" height="85" rx="10" fill="#ffffff" stroke="#93C5FD" stroke-width="1.5"/>
