    <text x="140" y="100" fill="#6B7280" font-size="10" text-anchor="middle">RESTful Endpoints + Rate Limiting</text>

    <rect x="15" y="135" width="250" height="65" rx="10" fill="#ffffff" stroke="#A7F3D0" stroke-width="1.5"/>
